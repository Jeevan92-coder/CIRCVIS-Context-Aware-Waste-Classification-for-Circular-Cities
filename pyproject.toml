[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circvis"
version = "0.1.0"
description = "CIRCVIS context-aware waste classification FastAPI backend"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.6",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "tensorflow-cpu==2.21.0",
    "scikit-learn==1.3.2",
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pandas==2.1.3",
    "pillow==10.1.0",
    "python-dotenv==1.0.0",
    "requests==2.31.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
